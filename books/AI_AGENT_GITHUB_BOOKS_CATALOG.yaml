selection_policy:
  primary_sources:
    - official_author_repository
    - official_companion_code
    - peer_reviewed_or_formal_publication_companion
  secondary_sources:
    - high_quality_study_guides
    - independent_reference_implementations
  reject_if:
    - copied_book_text_without_clear_license
    - no_provenance
    - no_meaningful_code_or_engineering_value
    - abandoned_or_trivial_fork

site:
  expose_as: Reference Implementations
  fields: [title, repo, type, status, fit_score, strengths, father_targets]
