name: FUA-001 Security Gates

on:
  push:
    branches: [factory-v0.1]
    paths:
      - "father_fua/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/fua-security.yml"
  pull_request:
    paths:
      - "father_fua/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/fua-security.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install application and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install bandit pip-audit detect-secrets cyclonedx-bom

      - name: SAST - Bandit
        run: bandit -r father_fua -q

      - name: Dependency audit - pip-audit
        run: pip-audit

      - name: Secret scan
        run: |
          detect-secrets scan father_fua tests scripts factory/api > /tmp/secrets.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/secrets.json",encoding="utf-8"))
          results=data.get("results",{})
          count=sum(len(v) for v in results.values())
          print("secret findings:",count)
          if count:
              for path,findings in results.items():
                  print(path, len(findings))
              raise SystemExit(1)
          PY

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --output-format JSON --output-file sbom-fua.json
          python - <<'PY'
          import json
          data=json.load(open("sbom-fua.json",encoding="utf-8"))
          print("bomFormat:",data.get("bomFormat"))
          print("components:",len(data.get("components",[])))
          assert data.get("bomFormat")=="CycloneDX"
          assert data.get("components")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: fua-001-sbom
          path: sbom-fua.json
