raw_idea: >
  Создать FATHER Engineering Platform — фабрику, которая сначала проектирует,
  собирает, тестирует и выпускает саму себя, а затем производит внешние
  AI/agent-системы из стандартизированных блоков.
author_or_sponsor: FATHER Project
known_context:
  - FATHER is the first self-product
  - platform uses chassis, block registry, agents, model slots, trust gates and evidence
known_constraints:
  - no_stage_pass_without_evidence
  - no_component_ready_without_system_integration_proof
  - llm_must_be_replaceable
  - polygon_must_be_independent
