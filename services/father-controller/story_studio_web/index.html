<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FATHER Story Studio</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div><span>FATHER ENGINEERING PLATFORM</span><h1>Story Studio</h1></div>
  <div id="brainBadge" class="brain">ONE BRAIN · loading...</div>
</header>
<main>
  <section class="left">
    <div class="toolbar">
      <label class="upload">Загрузить текст<input id="file" type="file" accept=".txt,.md,.text"></label>
      <button data-mode="CONTINUE" class="mode active">Продолжить</button>
      <button data-mode="REWRITE" class="mode">Переработать</button>
      <button data-mode="SIMILAR" class="mode">В похожей манере</button>
      <button data-mode="EDIT" class="mode">Правка</button>
    </div>
    <textarea id="source" placeholder="Вставьте или загрузите рассказ..."></textarea>
    <div class="instruction">
      <label>Уточнение для автора</label>
      <textarea id="instruction" placeholder="Например: сделай мрачнее; герой не должен знать правду; больше диалогов; сохрани первое лицо..."></textarea>
    </div>
    <div class="controls">
      <label>Творческая свобода <input id="temp" type="range" min="0.4" max="1.2" value="0.9" step="0.1"></label>
      <button id="run" class="primary">Написать</button>
    </div>
  </section>
  <section class="right">
    <div class="resultHead"><strong>Результат</strong><div><button id="useResult">Сделать исходником</button><button id="copy">Копировать</button></div></div>
    <textarea id="result" placeholder="Здесь появится результат..."></textarea>
    <div id="status">Готов к работе</div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
