services:
  father-chassis:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - father_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  father-chassis-modular:
    build: .
    command: ["uvicorn", "father.api_modular:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      FATHER_DATA_DIR: /app/data-modular
    volumes:
      - father_modular_data:/app/data-modular
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8081/health/live', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${FATHER_POSTGRES_DB:-father}
      POSTGRES_USER: ${FATHER_POSTGRES_USER:-father}
      POSTGRES_PASSWORD: ${FATHER_POSTGRES_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${FATHER_POSTGRES_USER:-father} -d ${FATHER_POSTGRES_DB:-father}
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - father_postgres:/var/lib/postgresql/data
    security_opt:
      - "no-new-privileges:true"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - father_redis:/data
    security_opt:
      - "no-new-privileges:true"

volumes:
  father_data:
  father_modular_data:
  father_postgres:
  father_redis:
