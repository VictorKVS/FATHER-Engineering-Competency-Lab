services:
  father-chassis:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - father_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: father
      POSTGRES_USER: father
      POSTGRES_PASSWORD: father
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U father -d father"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - father_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - father_redis:/data

volumes:
  father_data:
  father_postgres:
  father_redis:
