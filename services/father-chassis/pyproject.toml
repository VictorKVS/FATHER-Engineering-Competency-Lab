[project]
name = "father-chassis"
version = "1.0.0rc1"
description = "Executable FATHER Factory 1.0 RC1 reference implementation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8", "bandit>=1.7"]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
production = ["psycopg[binary]>=3.2", "redis>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
