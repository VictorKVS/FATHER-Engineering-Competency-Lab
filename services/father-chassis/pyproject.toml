[project]
name = "father-chassis"
version = "0.8.0"
description = "Executable FATHER Chassis 0.8 reference implementation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
production = ["psycopg[binary]>=3.2", "redis>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
