<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#16243a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8fb8ff"/></marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="75" fill="#ffffff" font-size="38" font-family="Segoe UI,Arial" font-weight="700">FATHER Brain &amp; Knowledge Infrastructure</text>
  <text x="70" y="112" fill="#9fb4ce" font-size="20" font-family="Segoe UI,Arial">Серийное производство квалифицированных Brain Packages</text>

  <g font-family="Segoe UI,Arial" filter="url(#shadow)">
    <g>
      <rect x="70" y="180" width="220" height="110" rx="18" fill="#1e3556" stroke="#4f83cc"/>
      <text x="180" y="225" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Sources</text>
      <text x="180" y="255" text-anchor="middle" fill="#bdd0e8" font-size="16">Docs · API · DB · OSINT</text>
    </g>
    <g>
      <rect x="345" y="180" width="220" height="110" rx="18" fill="#1e3556" stroke="#4f83cc"/>
      <text x="455" y="225" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Knowledge Factory</text>
      <text x="455" y="255" text-anchor="middle" fill="#bdd0e8" font-size="16">K1 → K20 pipeline</text>
    </g>
    <g>
      <rect x="620" y="180" width="220" height="110" rx="18" fill="#1e3556" stroke="#4f83cc"/>
      <text x="730" y="225" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Brain Package</text>
      <text x="730" y="255" text-anchor="middle" fill="#bdd0e8" font-size="16">Versioned · Portable · Signed</text>
    </g>
    <g>
      <rect x="895" y="180" width="220" height="110" rx="18" fill="#1e3556" stroke="#4f83cc"/>
      <text x="1005" y="225" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Qualification</text>
      <text x="1005" y="255" text-anchor="middle" fill="#bdd0e8" font-size="16">Quality · Perf · Security</text>
    </g>
    <g>
      <rect x="1170" y="180" width="160" height="110" rx="18" fill="#234b3b" stroke="#54b78b"/>
      <text x="1250" y="225" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">Release</text>
      <text x="1250" y="255" text-anchor="middle" fill="#c7eadb" font-size="16">Deploy / Rollback</text>
    </g>
  </g>

  <g stroke="#8fb8ff" stroke-width="4" marker-end="url(#arrow)">
    <line x1="290" y1="235" x2="337" y2="235"/>
    <line x1="565" y1="235" x2="612" y2="235"/>
    <line x1="840" y1="235" x2="887" y2="235"/>
    <line x1="1115" y1="235" x2="1162" y2="235"/>
  </g>

  <text x="70" y="370" fill="#fff" font-size="24" font-family="Segoe UI,Arial" font-weight="700">Storage capability layer — стандартны контракты, а не производители</text>

  <g font-family="Segoe UI,Arial">
    <g transform="translate(70,410)">
      <rect width="190" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="95" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Relational</text>
      <text x="95" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">PostgreSQL · SQLite</text>
    </g>
    <g transform="translate(285,410)">
      <rect width="190" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="95" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Vector</text>
      <text x="95" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">pgvector · Qdrant</text>
    </g>
    <g transform="translate(500,410)">
      <rect width="190" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="95" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Graph</text>
      <text x="95" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">Neo4j · adapters</text>
    </g>
    <g transform="translate(715,410)">
      <rect width="190" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="95" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Search</text>
      <text x="95" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">OpenSearch · adapters</text>
    </g>
    <g transform="translate(930,410)">
      <rect width="190" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="95" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Memory</text>
      <text x="95" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">Redis · alternatives</text>
    </g>
    <g transform="translate(1145,410)">
      <rect width="185" height="90" rx="16" fill="#192b45" stroke="#607fa6"/>
      <text x="92" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Objects</text>
      <text x="92" y="64" text-anchor="middle" fill="#a9bfd8" font-size="15">Local · S3-compatible</text>
    </g>
  </g>

  <text x="70" y="575" fill="#fff" font-size="24" font-family="Segoe UI,Arial" font-weight="700">Engineering gates</text>
  <g font-family="Segoe UI,Arial" font-size="18">
    <rect x="70" y="610" width="200" height="70" rx="16" fill="#234b3b"/><text x="170" y="653" text-anchor="middle" fill="#fff">Business ✅</text>
    <rect x="295" y="610" width="200" height="70" rx="16" fill="#234b3b"/><text x="395" y="653" text-anchor="middle" fill="#fff">System ✅</text>
    <rect x="520" y="610" width="200" height="70" rx="16" fill="#614c1d"/><text x="620" y="653" text-anchor="middle" fill="#fff">Architecture ◉</text>
    <rect x="745" y="610" width="200" height="70" rx="16" fill="#26364e"/><text x="845" y="653" text-anchor="middle" fill="#dce7f6">Test Architect</text>
    <rect x="970" y="610" width="160" height="70" rx="16" fill="#26364e"/><text x="1050" y="653" text-anchor="middle" fill="#dce7f6">Developer</text>
    <rect x="1155" y="610" width="175" height="70" rx="16" fill="#26364e"/><text x="1242" y="653" text-anchor="middle" fill="#dce7f6">Qualification</text>
  </g>
</svg>