agent_base:
  id: FATHER_AGENT_BASE_V1
  version: 1.0.0
  purpose: Canonical registry of all FATHER/NEXUS agents and their composition.

  agent_states:
    - DRAFT
    - CONFIGURED
    - AS_BUILT_HOLD
    - AS_BUILT_PASS
    - TESTING
    - VERIFIED
    - RELEASE_CANDIDATE
    - POLYGON_PASS
    - PRODUCTION_PROVEN

  record:
    required:
      - agent_id
      - identity
      - composition
      - model_policy
      - tools
      - security
      - runtime
      - eval
      - lifecycle
      - evidence

    identity:
      fields:
        - name
        - purpose
        - domain
        - owner

    composition:
      fields:
        - role
        - prompt
        - rag
        - knowledge
        - input_contract
        - output_contract

    model_policy:
      fields:
        - mode
        - required_capabilities
        - approved_models
        - primary
        - fallback
        - local_only
        - security_class

    tools:
      fields:
        - allowed
        - denied
        - permissions_profile

    security:
      fields:
        - baseline
        - threat_model
        - data_classification
        - last_security_result

    runtime:
      fields:
        - executor
        - workflow
        - health
        - last_run

    eval:
      fields:
        - profile
        - last_score
        - hard_fails

    lifecycle:
      fields:
        - state
        - maturity
        - baseline
        - release

    evidence:
      fields:
        - last_run
        - last_verified_run
        - evidence_refs
        - git_commit
