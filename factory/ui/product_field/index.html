<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FATHER Product Field</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">FATHER FACTORY • LAYER 1</div>
        <h1>Product Field</h1>
      </div>
      <div class="legend">
        <span><i class="dot idea"></i> IDEA</span>
        <span><i class="dot work"></i> IN WORK</span>
        <span><i class="dot hold"></i> HOLD</span>
        <span><i class="dot pass"></i> PASS</span>
        <span><i class="dot fail"></i> FAIL</span>
      </div>
    </header>

    <section class="workspace">
      <div class="canvas" id="canvas">
        <div class="grid"></div>
        <article class="product-card status-work" id="productCard" tabindex="0">
          <div class="product-head">
            <div>
              <div class="product-id">PRODUCT-001</div>
              <h2 id="productName">OSINT Reference Product</h2>
            </div>
            <span class="status-pill" id="statusPill">IN WORK</span>
          </div>

          <div class="product-meta">
            <span>Stage <b id="stageLabel">AG-000 Product Manager</b></span>
            <span>Gate <b id="gateLabel">DISCOVERY</b></span>
            <span>Evidence <b id="evidenceCount">8</b></span>
          </div>

          <div class="progress">
            <div class="progress-fill" id="progressFill" style="width:12%"></div>
          </div>

          <div class="specialist-strip" id="specialistStrip"></div>
          <div class="hint">Нажмите на продукт — открыть досье</div>
        </article>
      </div>

      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
          <div>
            <div class="eyebrow">PRODUCT DOSSIER</div>
            <h3 id="drawerTitle">OSINT Reference Product</h3>
          </div>
          <button id="closeDrawer" aria-label="Закрыть">×</button>
        </div>

        <nav class="tabs" id="tabs"></nav>
        <section class="drawer-body" id="drawerBody"></section>
      </aside>
    </section>
  </main>
  <script src="./model.js"></script>
  <script src="./app.js"></script>
</body>
</html>
