    - factory/bootstrap/FATHER_000_100_MAP.yaml
    - factory/agents/AGENT_REGISTRY.yaml
    - factory/model_fabric/MODEL_SLOT_CONTRACT.yaml
    - factory/runtime/RUN_PIPELINE.yaml
    - factory/stages/STAGE_RUN_RECORD.schema.yaml
    - factory/trust/RELEASE_TRUST_GATE.yaml

  gate:
    id: WAVE_0_PASS
    required:
      - self_product_registered
      - chassis_defined
      - block_registry_defined
      - stage_registry_defined
      - agent_registry_defined
      - model_slot_defined
      - run_record_defined
      - trust_gates_defined
      - stage_000_reference_pass
      - stage_000_local_emulation_pass
      - stage_000_local_llm_pass
      - stage_000_ab_pass

  status: IN_PROGRESS
