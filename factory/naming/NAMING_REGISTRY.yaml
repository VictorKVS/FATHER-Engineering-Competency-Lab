  rename_process:
    steps:
      - select_stable_id
      - set_new_public_name
      - append_old_name_to_previous_names
      - scan_references
      - update_ui_labels
      - update_docs_if_required
      - run_tests
      - create_rename_report
      - preserve_aliases
