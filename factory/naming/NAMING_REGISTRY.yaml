registry:
  id: NEXUS_NAMING_REGISTRY
  version: 1.0.0
  purpose: >
    Central terminology and naming layer for public branding, internal code names,
    roles, workspaces, blocks, links and references. Stable IDs must not change
    when public names change.

  rules:
    - stable_id_is_immutable
    - public_name_may_change
    - code_name_may_remain_internal
    - aliases_are_preserved_for_search_and_migration
    - references_must_point_to_stable_id_where_possible
    - ui_labels_should_resolve_from_registry
    - renaming_requires_reference_report

  entities:
    - stable_id: SYS-001
      entity_type: SYSTEM
      public_name: NEXUS AI Systems Engineering
      code_name: FATHER
      previous_names:
        - FATHER Engineering Platform
        - FATHER Engineering OS
      aliases:
        - NEXUS
        - FATHER
      references:
        - README.md
        - factory/ui/father_site/index.html
        - factory/ui/father_site/alina.html
      rename_policy: PUBLIC_NAME_ONLY

    - stable_id: ROLE-001
      entity_type: ROLE
      public_name: Knowledge & Reasoning Engineer
      code_name: ALINA
      previous_names:
        - ALINA Analyst
        - Analytical Core
      aliases:
        - ALINA
        - Knowledge Engineer
        - Reasoning Engineer
      references:
        - agents/alina/ROLE_KNOWLEDGE_REASONING_ENGINEER.md
        - factory/ui/father_site/alina.html
        - factory/ui/father_site/alina.js
        - agents/alina/profiles/literary/
      rename_policy: PUBLIC_NAME_ONLY

    - stable_id: WS-001
      entity_type: WORKSPACE
      public_name: Agent Designer
      code_name: FIELD_01
      aliases:
        - Проектирование агента
        - Agent Engineering
      references:
        - factory/ui/father_site/index.html
        - factory/ui/father_site/app.js
      rename_policy: PUBLIC_NAME_ONLY

    - stable_id: BLK-001
      entity_type: BLOCK
      public_name: Input Contract
      code_name: INPUT
      aliases: [Input, Входной контракт]
      references:
        - factory/ui/father_site/app.js
        - agents/alina/profiles/literary/INPUT_CONTRACT.yaml

    - stable_id: BLK-002
      entity_type: BLOCK
      public_name: Role
      code_name: ROLE
      aliases: [Agent Role, Роль]
      references:
        - factory/ui/father_site/app.js
        - agents/alina/

    - stable_id: BLK-003
      entity_type: BLOCK
      public_name: Prompt
      code_name: PROMPT
      aliases: [Prompt Engineering, System Prompt]
      references:
        - factory/ui/father_site/app.js
        - agents/alina/profiles/literary/PROMPT.md
        - factory/ui/father_site/alina.html
        - factory/ui/father_site/alina.js

    - stable_id: BLK-004
      entity_type: BLOCK
      public_name: RAG
      code_name: RAG
      aliases: [RAG Engineering, Retrieval]
      references:
        - factory/ui/father_site/app.js
        - agents/alina/profiles/literary/RAG_MANIFEST.yaml
        - factory/ui/father_site/alina.html
        - factory/ui/father_site/alina.js

    - stable_id: BLK-005
      entity_type: BLOCK
      public_name: Knowledge Base
      code_name: KB
      aliases: [Knowledge Engineering, KB]
      references:
        - factory/ui/father_site/app.js
        - agents/alina/profiles/literary/KNOWLEDGE_BASE.md
        - factory/ui/father_site/alina.html
        - factory/ui/father_site/alina.js

    - stable_id: BLK-006
      entity_type: BLOCK
      public_name: Model Slot
