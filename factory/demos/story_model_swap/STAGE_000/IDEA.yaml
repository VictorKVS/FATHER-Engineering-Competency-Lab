idea:
  idea_id: IDEA-DEMO-001
  raw_idea: >
    Создать LLM-систему продолжения рассказов на одной агентной конструкции
    со сменяемой LLM, единым входным и выходным контрактом, автоматическими
    тестами результата, возможностью автоматически переключить модель при
    отказе или непрохождении теста и сохранением evidence и результатов в GitHub.
  author_or_sponsor: USER
  known_context:
    - FATHER/NEXUS использует единый производственный каркас 000-100.
    - Model Slot должен позволять замену LLM без изменения алгоритма и контрактов.
    - Первый продукт используется как демонстрационный прогон фабрики.
  known_constraints:
    - Каждый переход между этапами требует Human Gate.
    - STAGE 000 не создаёт GitHub-репозиторий и локальный проект.
    - Один и тот же алгоритм должен работать с несколькими совместимыми LLM.
    - Результаты испытаний должны быть воспроизводимыми и сохраняться как evidence.
