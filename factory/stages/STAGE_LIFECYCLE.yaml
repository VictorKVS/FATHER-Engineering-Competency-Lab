lifecycle:
  states:
    - DRAFT
    - REFERENCE_RUNNING
    - REFERENCE_VERIFIED
    - EMULATION_RUNNING
    - EMULATION_VERIFIED
    - LOCAL_LLM_RUNNING
    - LOCAL_LLM_VERIFIED
    - AB_COMPARING
    - AB_ACCEPTED
    - STAGE_PASS
    - HOLD
    - FAIL

  transitions:
    DRAFT: [REFERENCE_RUNNING]
    REFERENCE_RUNNING: [REFERENCE_VERIFIED, FAIL]
    REFERENCE_VERIFIED: [EMULATION_RUNNING]
    EMULATION_RUNNING: [EMULATION_VERIFIED, FAIL]
    EMULATION_VERIFIED: [LOCAL_LLM_RUNNING]
    LOCAL_LLM_RUNNING: [LOCAL_LLM_VERIFIED, FAIL]
    LOCAL_LLM_VERIFIED: [AB_COMPARING]
    AB_COMPARING: [AB_ACCEPTED, HOLD, FAIL]
    AB_ACCEPTED: [STAGE_PASS]
    HOLD: [REFERENCE_RUNNING, EMULATION_RUNNING, LOCAL_LLM_RUNNING]
    FAIL: [DRAFT]

  invariant:
    - every_transition_has_run_id
    - every_run_has_versioned_prompt_rag_kb
    - every_pass_has_evidence
    - every_patch_explains_why
