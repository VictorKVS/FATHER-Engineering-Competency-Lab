permissions:
  id: STORY_PERMISSIONS_V1
  version: 1.0.0
  default: DENY
  tools:
    allowed: []
    denied:
      - filesystem_write
      - shell
      - arbitrary_network
      - secret_store
  network:
    allowed_model_endpoints:
      - http://127.0.0.1:11434
      - http://127.0.0.1:1234
    arbitrary_egress: false
  secrets:
    embedded_secrets_allowed: false
  memory:
    persistent_write: false
